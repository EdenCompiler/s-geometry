name: Native release packaging

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: ${{ matrix.target }} native build and package check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics and audio prerequisites
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl libglfw3 libglfw3-dev libopenal1 xvfb xauth mesa-utils libgl1-mesa-dri spirv-tools
          echo "SGEO_NATIVE_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib" >> "$GITHUB_ENV"

      - name: Install macOS graphics and audio prerequisites
        if: matrix.target == 'macos'
        run: |
          brew update
          brew install sbcl glfw openal-soft spirv-tools
          native_path="$(brew --prefix glfw)/lib:$(brew --prefix openal-soft)/lib"
          echo "SGEO_NATIVE_LIBRARY_PATH=$native_path" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$native_path${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install Windows compiler and native libraries
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install sbcl --yes --no-progress
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $sbclCommand = Get-Command sbcl.exe -ErrorAction SilentlyContinue
          if ($sbclCommand) {
            $sbcl = $sbclCommand.Source
          } else {
            $sbcl = (Get-ChildItem "$env:ProgramFiles\Steel Bank Common Lisp" -Filter sbcl.exe -Recurse -ErrorAction Stop | Select-Object -First 1).FullName
          }
          if (-not $sbcl) { throw 'SBCL executable was not found after installation' }
          Split-Path $sbcl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$vcpkg\vcpkg.exe" install glfw3:x64-windows openal-soft:x64-windows 'spirv-tools[tools]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed' }
          $nativeBin = "$vcpkg\installed\x64-windows\bin"
          $nativeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SGEO_NATIVE_LIBRARY_PATH=$nativeBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # O port do vcpkg baixa o código oficial do Khronos e valida o SHA-512 registrado no próprio port.
          $spirvToolsBin = "$vcpkg\installed\x64-windows\tools\spirv-tools"
          $spirvValidator = Join-Path $spirvToolsBin 'spirv-val.exe'
          if (-not (Test-Path $spirvValidator)) { throw "SPIR-V validator missing: $spirvValidator" }
          $spirvVersion = & $spirvValidator --version
          if ($LASTEXITCODE -ne 0) { throw 'SPIR-V validator did not start' }
          Write-Output "SPIRV-Tools validator: $spirvVersion"
          $spirvToolsBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap Lisp dependencies and compile game systems
        run: sbcl --dynamic-space-size 4096 --script tools/ci-setup.lisp

      - name: Run headless Lisp test suite
        run: sbcl --dynamic-space-size 4096 --script tools/test.lisp

      - name: Build native release package
        shell: bash
        if: runner.os != 'Windows'
        run: |
          sbcl --dynamic-space-size 4096 --script tools/build.lisp --output "artifacts/releases/sgeo-game-0.1.0-${{ matrix.target }}/"

      - name: Build native release package
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          sbcl --dynamic-space-size 4096 --script tools/build.lisp --output "artifacts/releases/sgeo-game-0.1.0-windows/"

      - name: Validate relocated Linux package and OpenGL rendering
        if: matrix.target == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -eu
          bundle="$PWD/artifacts/releases/sgeo-game-0.1.0-linux"
          relocated="${RUNNER_TEMP}/sgeo relocated bundle"
          isolated_home="${RUNNER_TEMP}/sgeo isolated home"
          hidden_checkout="${RUNNER_TEMP}/sgeo checkout hidden"
          hidden_quicklisp="${RUNNER_TEMP}/sgeo quicklisp hidden"
          original_home="$HOME"
          cp -a "$bundle" "$relocated"
          verify_package() {
            python3 - "$relocated" "$1" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          target = sys.argv[2]
          manifest = (root / "MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          assert manifest[0] == "S-GEOMETRY-PACKAGE 1", manifest[:1]
          assert "name sgeo-game" in manifest and "version 0.1.0" in manifest, manifest[:4]
          assert f"target {target}" in manifest, manifest[:4]
          listed = {}
          for line in manifest:
              if len(line) >= 66 and line[64:66] == "  ":
                  digest, relative = line[:64], line[66:].replace("\\", "/")
                  assert relative not in listed, f"duplicate manifest entry: {relative}"
                  listed[relative] = digest
          actual = {p.relative_to(root).as_posix(): p for p in root.rglob("*") if p.is_file() and p.name != "MANIFEST.sha256"}
          assert set(actual) == set(listed), f"manifest mismatch: missing={set(listed)-set(actual)}, extra={set(actual)-set(listed)}"
          for relative, path in actual.items():
              assert hashlib.sha256(path.read_bytes()).hexdigest() == listed[relative], relative
          required = {"bin/sgeo-game", "sgeo-game", "share/applications/sgeo-game.desktop", "assets/game.sgp"}
          assert required <= set(actual), f"missing layout files: {required-set(actual)}"
          native = [name.lower() for name in actual if "/lib/" in "/" + name.lower()]
          assert any("glfw" in name for name in native), f"GLFW library not bundled: {native}"
          assert any("openal" in name for name in native), f"OpenAL library not bundled: {native}"
          PY
          }
          verify_package linux
          restore_inputs() {
            if [ -d "$hidden_checkout" ]; then mv "$hidden_checkout" "$GITHUB_WORKSPACE"; fi
            if [ -d "$hidden_quicklisp" ]; then mv "$hidden_quicklisp" "$original_home/quicklisp"; fi
          }
          trap restore_inputs EXIT
          if [ -d "$original_home/quicklisp" ]; then mv "$original_home/quicklisp" "$hidden_quicklisp"; fi
          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$hidden_checkout"
          export HOME="$isolated_home"
          mkdir -p "$HOME"
          "$relocated/sgeo-game" --headless --self-test --diagnostics --profile "$RUNNER_TEMP/sgeo-headless-report.json" >"$RUNNER_TEMP/sgeo-headless.log" 2>&1
          cat "$RUNNER_TEMP/sgeo-headless.log"
          test -s "$RUNNER_TEMP/sgeo-headless-report.json"
          grep -q 'Standalone game self-test passed: 3 coins, open door, won; editor absent.' "$RUNNER_TEMP/sgeo-headless.log"
          python3 - "$RUNNER_TEMP/sgeo-headless-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["schema-version"] == 1, report.keys()
          assert report["frame"] == 240, report["frame"]
          assert report["renderer-info"]["editor-loaded"] is False, report["renderer-info"]
          assert report["renderer-info"]["asset-pack"] == "game.sgp", report["renderer-info"]
          assert report["errors"] == [], report["errors"]
          PY
          "$relocated/sgeo-game" --help
          if "$relocated/sgeo-game" --unknown-ci-option; then
            echo 'Unknown options unexpectedly succeeded.' >&2
            exit 1
          fi
          cp -a "$relocated" "${RUNNER_TEMP}/sgeo corrupted bundle"
          python3 - "${RUNNER_TEMP}/sgeo corrupted bundle/assets/game.sgp" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          content = bytearray(path.read_bytes())
          content[0] ^= 0xff
          path.write_bytes(content)
          PY
          if "${RUNNER_TEMP}/sgeo corrupted bundle/sgeo-game" --headless --self-test --assets "${RUNNER_TEMP}/sgeo corrupted bundle/assets/game.sgp" >"$RUNNER_TEMP/sgeo-corrupt.log" 2>&1; then
            echo 'Corrupted game asset pack unexpectedly loaded.' >&2
            exit 1
          fi
          grep -Eiq 'asset|pack|integrity|sha-256' "$RUNNER_TEMP/sgeo-corrupt.log"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            "$relocated/sgeo-game" --hidden --self-test --frames 240 \
            --profile "$RUNNER_TEMP/sgeo-gl-profile.json" --capture "$RUNNER_TEMP/sgeo-capture.ppm"
          test -s "$RUNNER_TEMP/sgeo-gl-profile.json"
          test -s "$RUNNER_TEMP/sgeo-capture.ppm"
          python3 - "$RUNNER_TEMP/sgeo-gl-profile.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["schema-version"] == 1 and report["frame"] == 240, report
          assert report["renderer-info"]["editor-loaded"] is False
          assert report["errors"] == [], report["errors"]
          PY

      - name: Validate relocated Windows package
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'artifacts/releases/sgeo-game-0.1.0-windows'
          $relocated = Join-Path $env:RUNNER_TEMP 'sgeo relocated bundle'
          $hiddenCheckout = Join-Path $env:RUNNER_TEMP 'sgeo checkout hidden'
          $hiddenQuicklisp = Join-Path $env:RUNNER_TEMP 'sgeo quicklisp hidden'
          $originalHome = $env:USERPROFILE
          $isolatedHome = Join-Path $env:RUNNER_TEMP 'sgeo isolated home'
          Copy-Item -Recurse $bundle $relocated
          $exe = Join-Path $relocated 'sgeo-game.exe'
          $verifyPackage = @'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = (root / "MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          assert manifest[0] == "S-GEOMETRY-PACKAGE 1", manifest[:1]
          assert "name sgeo-game" in manifest and "version 0.1.0" in manifest, manifest[:4]
          assert "target windows" in manifest, manifest[:4]
          listed = {}
          for line in manifest:
              if len(line) >= 66 and line[64:66] == "  ":
                  digest, relative = line[:64], line[66:].replace("\\", "/")
                  assert relative not in listed, f"duplicate manifest entry: {relative}"
                  listed[relative] = digest
          actual = {p.relative_to(root).as_posix(): p for p in root.rglob("*") if p.is_file() and p.name != "MANIFEST.sha256"}
          assert set(actual) == set(listed), f"manifest mismatch: missing={set(listed)-set(actual)}, extra={set(actual)-set(listed)}"
          for relative, path in actual.items():
              assert hashlib.sha256(path.read_bytes()).hexdigest() == listed[relative], relative
          required = {"sgeo-game.exe", "sgeo-game.cmd", "resources/game.sgp"}
          assert required <= set(actual), f"missing layout files: {required-set(actual)}"
          native = [name.lower() for name in actual]
          assert any("glfw" in name for name in native), f"GLFW library not bundled: {native}"
          assert any("openal" in name for name in native), f"OpenAL library not bundled: {native}"
          '@
          $verifyPackage | python - $relocated
          if ($LASTEXITCODE -ne 0) { throw 'Package manifest or layout validation failed' }
          try {
            Set-Location $env:RUNNER_TEMP
            if (Test-Path (Join-Path $originalHome 'quicklisp')) {
              Move-Item (Join-Path $originalHome 'quicklisp') $hiddenQuicklisp
            }
            Move-Item $env:GITHUB_WORKSPACE $hiddenCheckout
            New-Item -ItemType Directory -Force $isolatedHome | Out-Null
            $env:USERPROFILE = $isolatedHome
            $env:HOME = $isolatedHome
            $profilePath = Join-Path $env:RUNNER_TEMP 'sgeo-headless-report.json'
            $headlessLog = Join-Path $env:RUNNER_TEMP 'sgeo-headless.log'
            & $exe --headless --self-test --diagnostics --profile $profilePath *> $headlessLog
            if ($LASTEXITCODE -ne 0) { throw 'Relocated game self-test failed' }
            if (-not (Select-String -Path $headlessLog -Pattern 'Standalone game self-test passed: 3 coins, open door, won; editor absent.' -Quiet)) { throw 'Self-test completion diagnostic missing' }
            if (-not (Test-Path $profilePath)) { throw 'Profile report missing' }
            $report = Get-Content -Raw $profilePath | ConvertFrom-Json
            if ($report.'schema-version' -ne 1 -or $report.frame -ne 240) { throw 'Profile schema/frame count mismatch' }
            if ($report.'renderer-info'.'editor-loaded' -ne $false -or $report.'renderer-info'.'asset-pack' -ne 'game.sgp') { throw 'Profile package/editor diagnostics mismatch' }
            if ($report.errors.Count -ne 0) { throw 'Profile recorded runtime errors' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw '--help failed' }
            & $exe --unknown-ci-option
            if ($LASTEXITCODE -eq 0) { throw 'Unknown option unexpectedly succeeded' }
            $corrupt = Join-Path $env:RUNNER_TEMP 'sgeo corrupted bundle'
            Copy-Item -Recurse $relocated $corrupt
            $asset = Join-Path $corrupt 'resources/game.sgp'
            $bytes = [System.IO.File]::ReadAllBytes($asset)
            $bytes[0] = $bytes[0] -bxor 255
            [System.IO.File]::WriteAllBytes($asset, $bytes)
            $log = Join-Path $env:RUNNER_TEMP 'sgeo-corrupt.log'
            & (Join-Path $corrupt 'sgeo-game.exe') --headless --self-test --assets $asset *> $log
            if ($LASTEXITCODE -eq 0) { throw 'Corrupted game asset pack unexpectedly loaded' }
            if (-not (Select-String -Path $log -Pattern 'asset|pack|integrity|sha-256' -Quiet)) { throw 'Corruption failure had no asset diagnostic' }
          } finally {
            $env:USERPROFILE = $originalHome
            $env:HOME = $originalHome
            if (Test-Path $hiddenCheckout) { Move-Item $hiddenCheckout $env:GITHUB_WORKSPACE }
            if (Test-Path $hiddenQuicklisp) { Move-Item $hiddenQuicklisp (Join-Path $originalHome 'quicklisp') }
          }

      - name: Validate Windows hidden rendering with Mesa llvmpipe
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $verifiedPackage = Join-Path $env:RUNNER_TEMP 'sgeo relocated bundle'
          $renderPackage = Join-Path $env:RUNNER_TEMP 'sgeo Mesa render bundle'
          Copy-Item -Recurse $verifiedPackage $renderPackage
          $exe = Join-Path $renderPackage 'sgeo-game.exe'
          $mesaVersion = '26.2.4'
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-$mesaVersion-release-msvc.7z"
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive
          $expectedSha256 = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $mesaArchive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Mesa archive checksum mismatch: $actualSha256" }
          $extract = Join-Path $env:RUNNER_TEMP 'mesa llvmpipe extract'
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x -y $mesaArchive "-o$extract"
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the pinned Mesa package' }
          foreach ($dll in @('opengl32.dll', 'libglapi.dll', 'libgallium_wgl.dll')) {
            $source = Join-Path $extract "x64/$dll"
            if (-not (Test-Path $source)) { throw "Pinned Mesa package is missing $source" }
            Copy-Item $source $renderPackage
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $profilePath = Join-Path $env:RUNNER_TEMP 'sgeo-gl-profile.json'
          $capturePath = Join-Path $env:RUNNER_TEMP 'sgeo-capture.ppm'
          $runLog = Join-Path $env:RUNNER_TEMP 'sgeo-gl.log'
          & $exe --hidden --self-test --frames 240 --diagnostics --profile $profilePath --capture $capturePath *> $runLog
          if ($LASTEXITCODE -ne 0) { Get-Content $runLog; throw 'Windows hidden OpenGL self-test failed' }
          if (-not (Select-String -Path $runLog -Pattern 'Standalone game self-test passed: 3 coins, open door, won; editor absent.' -Quiet)) { throw 'Hidden-window game self-test completion diagnostic missing' }
          if (-not (Test-Path $capturePath) -or (Get-Item $capturePath).Length -le 16) { throw 'OpenGL framebuffer capture is missing or empty' }
          $report = Get-Content -Raw $profilePath | ConvertFrom-Json
          if ($report.'schema-version' -ne 1 -or $report.frame -ne 240) { throw 'OpenGL profile schema/frame count mismatch' }
          if ($report.'renderer-info'.'editor-loaded' -ne $false) { throw 'Editor was loaded in the release profile' }
          $rendererDevice = [string]$report.'renderer-info'.device
          if (-not $rendererDevice.ToLowerInvariant().Contains('llvmpipe')) { throw "Profile does not prove Mesa llvmpipe: $rendererDevice" }
          if ($report.errors.Count -ne 0) { throw 'OpenGL profile recorded runtime errors' }

      - name: Validate relocated macOS package
        if: matrix.target == 'macos'
        run: |
          set -eu
          bundle="$PWD/artifacts/releases/sgeo-game-0.1.0-macos"
          relocated="${RUNNER_TEMP}/sgeo relocated bundle"
          isolated_home="${RUNNER_TEMP}/sgeo isolated home"
          hidden_checkout="${RUNNER_TEMP}/sgeo checkout hidden"
          hidden_quicklisp="${RUNNER_TEMP}/sgeo quicklisp hidden"
          original_home="$HOME"
          cp -a "$bundle" "$relocated"
          python3 - "$relocated" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1]); target = "macos"
          manifest = (root / "sgeo-game.app/MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          assert manifest[0] == "S-GEOMETRY-PACKAGE 1", manifest[:1]
          assert "name sgeo-game" in manifest and "version 0.1.0" in manifest, manifest[:4]
          assert "target macos" in manifest, manifest[:4]
          app = root / "sgeo-game.app"
          listed = {}
          for line in manifest:
              if len(line) >= 66 and line[64:66] == "  ":
                  digest, relative = line[:64], line[66:].replace("\\", "/")
                  assert relative not in listed, f"duplicate manifest entry: {relative}"
                  listed[relative] = digest
          actual = {p.relative_to(app).as_posix(): p for p in app.rglob("*") if p.is_file() and p.name != "MANIFEST.sha256"}
          assert set(actual) == set(listed), f"manifest mismatch: missing={set(listed)-set(actual)}, extra={set(actual)-set(listed)}"
          for relative, path in actual.items(): assert hashlib.sha256(path.read_bytes()).hexdigest() == listed[relative], relative
          required = {"Contents/MacOS/sgeo-game", "Contents/Info.plist", "Contents/Resources/game.sgp"}
          assert required <= set(actual), f"missing layout files: {required-set(actual)}"
          native = [name.lower() for name in actual if "frameworks" in name.lower()]
          assert any("glfw" in name for name in native), f"GLFW library not bundled: {native}"
          assert any("openal" in name for name in native), f"OpenAL library not bundled: {native}"
          PY
          restore_inputs() {
            if [ -d "$hidden_checkout" ]; then mv "$hidden_checkout" "$GITHUB_WORKSPACE"; fi
            if [ -d "$hidden_quicklisp" ]; then mv "$hidden_quicklisp" "$original_home/quicklisp"; fi
          }
          trap restore_inputs EXIT
          if [ -d "$original_home/quicklisp" ]; then mv "$original_home/quicklisp" "$hidden_quicklisp"; fi
          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$hidden_checkout"
          export HOME="$isolated_home"
          mkdir -p "$HOME"
          exe="$relocated/sgeo-game.app/Contents/MacOS/sgeo-game"
          "$exe" --headless --self-test --diagnostics --profile "$RUNNER_TEMP/sgeo-headless-report.json" >"$RUNNER_TEMP/sgeo-headless.log" 2>&1
          cat "$RUNNER_TEMP/sgeo-headless.log"
          test -s "$RUNNER_TEMP/sgeo-headless-report.json"
          grep -q 'Standalone game self-test passed: 3 coins, open door, won; editor absent.' "$RUNNER_TEMP/sgeo-headless.log"
          python3 - "$RUNNER_TEMP/sgeo-headless-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["schema-version"] == 1 and report["frame"] == 240, report
          assert report["renderer-info"]["editor-loaded"] is False
          assert report["renderer-info"]["asset-pack"] == "game.sgp"
          assert report["errors"] == [], report["errors"]
          PY
          "$exe" --help
          if "$exe" --unknown-ci-option; then
            echo 'Unknown options unexpectedly succeeded.' >&2
            exit 1
          fi
          # macOS hosted runners expose Cocoa and the system OpenGL framework;
          # run the hidden GLFW path on the same native packaged executable.
          "$exe" --hidden --self-test --frames 240 --profile "$RUNNER_TEMP/sgeo-gl-profile.json" --capture "$RUNNER_TEMP/sgeo-capture.ppm" >"$RUNNER_TEMP/sgeo-gl.log" 2>&1
          cat "$RUNNER_TEMP/sgeo-gl.log"
          grep -q 'Standalone game self-test passed: 3 coins, open door, won; editor absent.' "$RUNNER_TEMP/sgeo-gl.log"
          test -s "$RUNNER_TEMP/sgeo-gl-profile.json"
          test -s "$RUNNER_TEMP/sgeo-capture.ppm"
          python3 - "$RUNNER_TEMP/sgeo-gl-profile.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["schema-version"] == 1 and report["frame"] == 240, report
          assert report["renderer-info"]["editor-loaded"] is False
          assert report["errors"] == [], report["errors"]
          PY

      - name: Upload native package and validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgeo-release-${{ matrix.target }}
          path: |
            artifacts/releases/sgeo-game-0.1.0-${{ matrix.target }}
            artifacts/releases/sgeo-game-0.1.0-${{ matrix.target }}.*
            artifacts/releases/sgeo-game-0.1.0-${{ matrix.target }}/**/*.tar.gz
            artifacts/releases/sgeo-game-0.1.0-${{ matrix.target }}/**/*.zip
            ${{ runner.temp }}/sgeo-headless-report.json
            ${{ runner.temp }}/sgeo-gl-profile.json
            ${{ runner.temp }}/sgeo-capture.ppm
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
